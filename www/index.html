<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<h1>
			<a href="localhost:8080" id="title">webserv</a>
		</h1>

		<div id="header-info">
			<h2 id="made-by">
				made by Alisa, Ally, and Tutku
			</h2>

			<h2>
				<a href="../README.md" id="read-me">Read Me</a>
			</h2>
		</div>

		<canvas id="confetti-canvas"></canvas>
		<form action="confetti.py" method="POST" enctype="multipart/form-data"> //check after cgi is handled
			<br>
			<button id="confetti-button" class="btn-55"> Confetti! </button>
			<br>
		</form>

		<button id="regular-button"class="btn-55">
			This button also does confetti, 
			but JS does not ask to "execute a script first"
		</button>

		<br>

		<script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
		<script src="confetti.js"></script>

		<!--UPLOAD BUTTON IMPLEMENTATION-->
		<label for="fileUpload" class="btn-55 uploadButton">
			Choose File
		</label>

		<p id="fileName">
			No file selected 
		</p>

		<form action="upload.py" id="uploadForm" method="POST" enctype="multipart/form-data"onsubmit="return submitWithoutReload(event)"> 

			<input type="file" id="fileUpload" class="hideClass" name="fileUpload">
			<input type="submit" id="submitButton" value="Upload" hidden> 
			<p id="uploadMessage"></p>
		</form>
		<script src="upload.js"></script>
	</body>
</html>
