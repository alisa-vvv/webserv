server 
{
	server_name webserv;
	listen 127.0.0.1:8080;
	# root /home/aalombro/projects/webserv/www;
	root /www;
	client_max_body_size 5M;
	cgi_pass .py /usr/bin/python3;
	autoindex on;
	
	# error_page 300 /home/aalombro/projects/webserv/error_pages/300.html;
	error_page 400 /error_pages/400.html;
	error_page 401 /home/aalombro/projects/webserv/error_pages/401.html;
	error_page 404 /home/aalombro/projects/webserv/error_pages/404.html;
	
	location /
	{
		root /home/aalombro/projects/webserv/www;
		index index.html;
		allowed_methods GET;
		autoindex on;
	}
	
	location /cgi-bin
	{
		root /cgi-bin;
		cgi_pass .py /usr/bin/python3;
		allowed_methods GET POST;
		autoindex off;
	}
	
	location /playlists
	{
		index index.html;
		allowed_methods GET;
		autoindex on;
	}
}


server {
	server_name	example.org index.html;
	listen 127.0.0.1:8081;
	root /data;
	client_max_body_size 5M;
	cgi_pass .py /usr/bin/python3;
	autoindex on;

	error_page 400 /error_pages/400.html;
	error_page 403 /error_pages/403.html;
	error_page 404 /error_pages/404.html;
	error_page 405 /error_pages/405.html;
	error_page 413 /error_pages/413.html;
	error_page 500 /error_pages/500.html;
	error_page 502 /error_pages/502.html;

	location /www {
		index /index.html;
		allowed_methods GET POST DELETE;
		upload_store /upload;
		cgi_pass .py /usr/bin/python3;
		autoindex off;
	}

	location / {
		root /data;
		index /html/index.html;
		allowed_methods GET POST;
		upload_store /upload;
		autoindex on;

    	}

# 	# CGI Handler
	location /cgi-bin {
		root /data/cgi-bin;
		cgi_pass .py /usr/bin/python3;
		allowed_methods GET POST DELETE;
		autoindex off;
	}

	location /images {
		root  /data/images;
		index  index.html;
		allowed_methods  GET;
		autoindex off;
	}

	location /upload {
		root  /data/upload;
		index index.html;
		allowed_methods  GET POST DELETE;
		autoindex off;
	}

}