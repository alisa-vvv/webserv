server 
{
	server_name webserv;
	listen 127.0.0.1:8080;
	root /www;
	client_max_body_size 5m;
	cgi_pass .py /usr/bin/python3;
	autoindex on;
	
	# error_page 300 /error_pages/300.html;
	error_page 400 /error_pages/400.html;
	error_page 401 /error_pages/401.html;
	error_page 404 /error_pages/404.html;
	
	location /
	{
		root /www;
		index index.html;
		allowed_methods GET;
		autoindex on;
	}
	
	location /cgi-bin
	{
		root /server/cgi-bin;
		cgi_pass .py /usr/bin/python3;
		allowed_methods GET POST;
		autoindex off;
	}
	
	location /playlists
	{
		index index.html;
		allowed_methods GET;
		autoindex on;
	}
}
